# Example AgentTeams member that uses the Cursor agent CLI as its LLM route.
#
# After `agent login`, run `agent models` and replace `model` with a listed slug.
# Fast: model: <slug>-fast
# Extra High: reasoningEffort: xhigh  (or model: <slug>-xhigh)
#
# Keep mailbox/task tools on the member. Do not add cursor_agent_* ACP tools.
# Missing `agent` or login fails with AUTH / MISSING_CREDENTIAL — no silent fallback.

members:
  - name: implementer
    role: Implement in-scope checkout work.
    provider: cursor
    model: cursor-grok-4.6-high
    reasoningEffort: high
    tools:
      - mailbox
      - task
